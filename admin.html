<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1877F2">
<meta name="robots" content="noindex,nofollow">
<title>Admin Control Center</title>
<style>
:root{--brand-blue:#1877F2;--error-red:#FA3E3E;--bg-color:#F0F2F5;--container-bg:#FFFFFF;--text-primary:#1C1E21;--text-secondary:#606770;--border-color:#CCD0D5;--fs:15px}
body.dark-mode{--bg-color:#18191A;--container-bg:#242526;--text-primary:#E4E6EB;--text-secondary:#B0B3B8;--border-color:#3E4042}
*{box-sizing:border-box;margin:0;padding:0;font-family:Roboto,sans-serif;font-size:var(--fs);-webkit-tap-highlight-color:transparent}
html,body{width:100dvw;height:100dvh;overflow:hidden;background:var(--bg-color);color:var(--text-primary)}
h1,h2,b,.btn{font-weight:700}
p{line-height:1.5}
button{cursor:pointer;touch-action:manipulation}
.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mut{color:var(--text-secondary)}
.err{color:var(--error-red)}
.bar{position:fixed;top:0;left:0;width:100dvw;height:56px;display:flex;align-items:center;background:var(--brand-blue);color:#fff;z-index:5}
.bar h1{flex:1;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:48px;height:48px;flex:none;border:0;background:none;color:inherit;display:grid;place-items:center;border-radius:50%}
.bar .ib:active{background:rgba(255,255,255,.25)}
.pg{position:fixed;top:56px;bottom:0;left:0;width:100dvw;overflow-x:hidden;overflow-y:auto;padding:16px}
.card{background:var(--container-bg);border:1px solid var(--border-color);border-radius:16px;padding:16px;margin-bottom:12px;overflow-wrap:anywhere}
.card h2{margin-bottom:8px}
.btn{width:100%;min-height:48px;border:0;border-radius:24px;background:var(--brand-blue);color:#fff;padding:0 20px;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px}
.btn:active{filter:brightness(.85)}
.btn.danger{background:var(--error-red)}
input{width:100%;min-height:48px;border:1px solid var(--border-color);border-radius:12px;padding:0 12px;background:var(--container-bg);color:var(--text-primary);margin-bottom:12px}
input:focus{outline:2px solid var(--brand-blue);border-color:transparent}
.row2{display:flex;align-items:center;gap:8px;min-width:0}
.row2>span{flex:1;min-width:0}
.sw{width:56px;height:32px;flex:none;border-radius:16px;background:var(--border-color);position:relative;border:0;display:block;transition:background .2s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-checked="true"]{background:var(--brand-blue)}
.sw[aria-checked="true"]::after{transform:translateX(24px)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--border-color)}
.kv:last-child{border:0}
.timer{color:var(--brand-blue);font-weight:700}
.scrim{position:fixed;inset:0;width:100dvw;height:100dvh;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:40}
.toast{position:fixed;top:50%;left:50%;width:80dvw;transform:translate(-50%,-50%) scale(.9);display:flex;align-items:center;gap:12px;background:var(--container-bg);color:var(--text-primary);border:1px solid var(--border-color);border-left:6px solid var(--brand-blue);border-radius:16px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:.2s;z-index:50}
.toast.err{border-left-color:var(--error-red)}
.toast.err .ic{color:var(--error-red)}
.toast .ic{color:var(--brand-blue)}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.ring{width:48px;height:48px;border:5px solid var(--border-color);border-top-color:var(--brand-blue);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.block,.center{position:fixed;inset:0;width:100dvw;height:100dvh;display:grid;place-items:center;text-align:center;padding:24px;background:var(--bg-color);overflow-y:auto;overflow-x:hidden}
.block>div,.center>div{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}
.block .ic{width:48px;height:48px;color:var(--error-red)}
.logo{width:120px;height:120px;border-radius:50%;background:var(--brand-blue);color:#fff;border:0;display:grid;place-items:center;user-select:none;-webkit-user-select:none}
.logo .ic{width:64px;height:64px}
.okc{color:var(--brand-blue)}
.okc .ic{width:64px;height:64px}
.code{text-align:center;letter-spacing:8px;font-weight:700}
</style>
</head>
<body>
<div id="app-root"><div id="app"></div></div>
<script>

      '.' + P + '-snap{transition:transform .25s cubic-bezier(.2,.8,.2,1),width .25s}' +
      '.' + P + '-shake{animation:' + P + '-sh .35s}@keyframes ' + P + '-sh{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}' +
      '.' + P + '-spin{display:grid;place-items:center}.' + P + '-spin i{width:56px;height:56px;border:6px solid rgba(24,119,242,.2);border-top-color:var(--brand-blue,#1877F2);border-radius:50%;animation:' + P + '-rot .8s linear infinite}' +

    var I = {
      pen: 'M4 20l4-1 11-11-3-3L5 16zM14 6l3 3', book: 'M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM8 8h7', quote: 'M7 17h3l2-4V7H6v6h3M15 17h3l2-4V7h-6v6h3',
      check: 'M5 12l5 5 9-10', star: 'M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2-5.5-2.9-5.5 2.9 1-6.2L3 9.6l6.2-.9z', bolt: 'M13 2L5 14h6l-1 8 8-12h-6z',

      return function () {

<script>
(() => {
  const API_URL = 'PASTE_WEB_APP_URL_HERE';

  const api = async (a, d) => {
    try {
      const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ a }, d)), keepalive: true });
      return await r.json();
    } catch (e) { return { ok: false, e: 'net' }; }
  };

  const I = {
    shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
    check: '<path d="M5 12l5 5 9-10"/>',
    logout: '<path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>',
    moon: '<path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/>',
    alert: '<path d="M12 3l10 18H2zM12 10v5M12 18v.5"/>'
  };
  const ic = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;
  const ls = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const theme = t => {
    if (!t) t = ls('dvt') || 'light';
    document.body.classList.toggle('dark-mode', t === 'dark');
    ls('dvt', t);
    const b = document.getElementById('th'); if (b) b.innerHTML = ic(t === 'dark' ? 'sun' : 'moon');
  };
  const toggleTheme = () => theme(document.body.classList.contains('dark-mode') ? 'light' : 'dark');

  const toast = (m, t) => {
    let e = document.getElementById('toast');
    if (!e) { e = document.createElement('div'); e.id = 'toast'; document.body.appendChild(e); }
    e.className = 'toast show ' + (t || '');
    e.innerHTML = ic(t === 'err' ? 'alert' : 'check') + '<span>' + esc(m) + '</span>';
    clearTimeout(toast._t); toast._t = setTimeout(() => e.classList.remove('show'), 2400);
  };
  const busy = on => {
    let e = document.getElementById('busy');
    if (!on) { if (e) e.remove(); return; }
    if (e) return;
    e = document.createElement('div'); e.id = 'busy'; e.className = 'scrim'; e.innerHTML = '<div class="ring"></div>';
    document.body.appendChild(e);
  };

  theme();
  const android = /Android/i.test(navigator.userAgent) && matchMedia('(pointer:coarse)').matches && !matchMedia('(hover:hover) and (pointer:fine)').matches;
  if (!android) {
    document.body.innerHTML = `<div class="block"><div>${ic('alert')}<p>This app works on Android phones only.</p></div></div>`;
    return;
  }

  const A = document.getElementById('app');
  let taps = 0, tt, tok = '', cd, en = true;
  const wrap = h => (A.innerHTML = `<div class="center"><div>${h}</div></div>`);
  const spin = msg => wrap(`<div class="ring"></div>${msg ? `<p>${msg}</p>` : ''}`);

  const home = () => {
    clearInterval(cd); taps = 0;
    wrap(`<button class="logo" id="lg" aria-label="Admin Control Center">${ic('shield')}</button><h2>Admin Control Center</h2>`);
    document.getElementById('lg').onclick = () => {
      taps++; clearTimeout(tt); tt = setTimeout(() => (taps = 0), 2500);
      if (taps === 4) { taps = 0; sendScreen(); }
    };
  };

  const sendScreen = err => {
    wrap(`<h2>Verify it is you</h2>${err ? `<p class="err">${err}</p>` : ''}<button class="btn" id="snd">Send me code</button>`);
    document.getElementById('snd').onclick = send;
  };

  const send = async () => {
    spin();
    const r = await api('otp');
    if (!r.ok) return sendScreen(r.e === 'wait' ? 'Please wait a minute before requesting another code.' : 'Could not send the code. Try again later.');
    spin('Verification code has been sent to your registered email.');
    setTimeout(verifyScreen, 1800);
  };

  const verifyScreen = err => {
    wrap(`<h2>Enter code</h2><p class="mut">Expires in <span class="timer" id="tm">10:00</span></p>
      <input id="cd" class="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000">
      ${err ? `<p class="err">${err}</p>` : ''}<button class="btn" id="vf">Verify</button>`);
    const end = Date.now() + 600000, tm = document.getElementById('tm');
    clearInterval(cd);
    cd = setInterval(() => {
      const s = Math.max(0, Math.ceil((end - Date.now()) / 1000));
      tm.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
      if (!s) { clearInterval(cd); sendScreen('Code expired. Request a new one.'); }
    }, 1000);
    document.getElementById('vf').onclick = verify;
  };

  const verify = async () => {
    const o = document.getElementById('cd').value.trim();
    if (!/^\d{6}$/.test(o)) return toast('Enter the 6-digit code', 'err');
    spin();
    const r = await api('verify', { o });
    if (!r.ok) return verifyScreen('Invalid or expired code.');
    clearInterval(cd); tok = r.t;
    wrap(`<div class="okc">${ic('check')}</div><h2>You have been verified.</h2>`);
    const s = await api('stats', { t: tok });
    setTimeout(() => (s.ok ? dash(s) : logout()), 1000);
  };

  const dash = s => {
    en = s.en;
    A.innerHTML = `<header class="bar"><button class="ib" id="th" aria-label="Theme"></button><h1>Admin Control Center</h1><button class="ib" id="lo" aria-label="Logout">${ic('logout')}</button></header>
      <main class="pg">
        <div class="card"><div class="row2"><span><b>System status</b><br><span class="mut" id="st">${en ? 'Enabled' : 'Disabled'}</span></span><button class="sw" id="tg" role="switch" aria-checked="${en}" aria-label="Enable or disable shortening"></button></div></div>
        <div class="card"><h2>Quota &amp; usage</h2>
          <div class="kv"><span>Mail quota remaining</span><b>${s.rem}</b></div>
          <div class="kv"><span>Quota used today (OTPs sent)</span><b>${s.used}</b></div>
          <div class="kv"><span>Total URLs generated</span><b>${s.total}</b></div></div>
        <button class="btn danger" id="lo2">${ic('logout')}Logout</button>
      </main>`;
    theme(ls('dvt') || 'light');
    document.getElementById('th').onclick = toggleTheme;
    document.getElementById('lo').onclick = document.getElementById('lo2').onclick = logout;
    document.getElementById('tg').onclick = async () => {
      busy(true);
      const r = await api('toggle', { t: tok, v: !en });
      busy(false);
      if (r.e === 'auth') return logout();
      if (!r.ok) return toast('Could not update', 'err');
      en = r.en;
      document.getElementById('tg').setAttribute('aria-checked', en);
      document.getElementById('st').textContent = en ? 'Enabled' : 'Disabled';
      toast(en ? 'System enabled' : 'System disabled');
    };
  };

  const logout = () => {
    const t = tok; tok = ''; clearInterval(cd);
    if (t) api('out', { t });
    document.body.innerHTML = '';
    location.replace(location.pathname);
  };

  home();
})();
</script>
</body>
</html>
